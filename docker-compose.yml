services:
  heimdall:
    build: .
    image: heimdall:local
    container_name: heimdall
    restart: always
    environment:
      - TZ=${TZ:-America/New_York}
      - ALLOW_INTERNAL_REQUESTS=${ALLOW_INTERNAL_REQUESTS:-true}
      - APP_URL=${APP_URL:-http://localhost}
    volumes:
      - ./data/config:/config
    ports:
      - "${HTTP_PORT:-8080}:80"
