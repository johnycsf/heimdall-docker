services:
  heimdall:
    build: .
    image: ghcr.io/johnycsf/heimdall:latest
    container_name: heimdall
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/New_York}
      - ALLOW_INTERNAL_REQUESTS=${ALLOW_INTERNAL_REQUESTS:-true}
      - APP_URL=${APP_URL:-http://localhost}
    volumes:
      - ./data/config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
